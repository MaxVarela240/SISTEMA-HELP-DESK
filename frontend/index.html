<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Help Desk - Sistema de Soporte</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>🎧 Help Desk</h1>
    <nav class="app-nav">
      <button class="nav-btn active" data-view="dashboard">Dashboard</button>
      <button class="nav-btn" data-view="formulario">Nuevo Ticket</button>
      <button class="nav-btn" data-view="lista">Lista de Tickets</button>
    </nav>
  </header>

  <main id="app">
    <section id="view-dashboard" class="view active"></section>
    <section id="view-formulario" class="view"></section>
    <section id="view-lista" class="view"></section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/formulario.js"></script>
  <script src="js/lista.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
